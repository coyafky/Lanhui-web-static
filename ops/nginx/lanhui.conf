# =============================================================================
# 蓝辉轻改 LANHUI — Nginx static site configuration
# =============================================================================
# Target: Next.js static export (output: "export" + trailingSlash: true)
# Server: Tencent Cloud CVM / any Nginx host
# Path:  /etc/nginx/sites-available/lanhui.conf → symlink to sites-enabled/
#
# Before deploying:
#   1. Confirm www.lanhuiqinggai.com resolves to this server
#   2. Replace SSL certificate paths
#   3. Run: nginx -t && nginx -s reload
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.lanhuiqinggai.com;

    # Let's Encrypt ACME challenge (if using certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/lanhui/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS server
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lanhuiqinggai.com;

    # SSL — update paths before deploying
    ssl_certificate     /etc/nginx/ssl/lanhui.pem;
    ssl_certificate_key /etc/nginx/ssl/lanhui.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # -----------------------------------------------------------------------
    # Document root → symlink managed by ops/deploy/deploy.sh
    # -----------------------------------------------------------------------
    root /var/www/lanhui/current;
    index index.html;

    # -----------------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # HSTS — enable only AFTER verifying HTTPS works correctly
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # -----------------------------------------------------------------------
    # Gzip
    # -----------------------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Cache rules
    # -----------------------------------------------------------------------

    # Next.js static assets — content-hashed, immutable
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # No gzip — already compressed at build time
        gzip off;
    }

    # Product images & public assets — medium cache
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        # Images are already compressed (WebP/JPEG), skip gzip
        gzip off;
    }

    # robots.txt & sitemap.xml — short cache
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # HTML pages — no cache (so updates appear immediately)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # -----------------------------------------------------------------------
    # Custom error page
    # -----------------------------------------------------------------------
    error_page 404 /404.html;

    # -----------------------------------------------------------------------
    # Deny access to hidden files
    # -----------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # Logs
    # -----------------------------------------------------------------------
    access_log /var/log/nginx/lanhui.access.log;
    error_log /var/log/nginx/lanhui.error.log;
}
